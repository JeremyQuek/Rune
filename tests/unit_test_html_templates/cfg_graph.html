<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Flow: __TITLE__</title>
<style>
:root {
    --bg: #ffffff; --panel: #f6f7f9; --border: #d9dce1; --text: #1f2328; --muted: #6b7280;
    --grid: #eef0f3; --edge: #b8bec8; --node: #ffffff; --shadow: rgba(15, 23, 42, .08);
    --module: #475569; --branch: #d97706; --arm: #0d9488; --body: #2563eb; --def: #7c3aed; --exit: #9ca3af;
    --in: #ea580c; --out: #0891b2; --hl: rgba(234, 88, 12, .12); --scc: #db2777;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb; --muted: #8b93a1;
    --grid: #161a21; --edge: #4a5262; --node: #1b1f27; --shadow: rgba(0, 0, 0, .4);
    --module: #94a3b8; --branch: #fbbf24; --arm: #2dd4bf; --body: #60a5fa; --def: #a78bfa; --exit: #6b7280;
    --in: #fb923c; --out: #22d3ee; --hl: rgba(251, 146, 60, .14); --scc: #f472b6;
    }
}
:root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb; --muted: #8b93a1;
    --grid: #161a21; --edge: #4a5262; --node: #1b1f27; --shadow: rgba(0, 0, 0, .4);
    --module: #94a3b8; --branch: #fbbf24; --arm: #2dd4bf; --body: #60a5fa; --def: #a78bfa; --exit: #6b7280;
    --in: #fb923c; --out: #22d3ee; --hl: rgba(251, 146, 60, .14); --scc: #f472b6;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
       font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 16px;
         align-items: center; flex-wrap: wrap; }
header h1 { font-size: 14px; margin: 0; font-weight: 600; }
.legend { display: flex; gap: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
                       margin-right: 5px; vertical-align: -1px; border: 2px solid var(--c); }
.tools { margin-left: auto; display: flex; gap: 6px; }
button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
         padding: 3px 10px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: not-allowed; border-color: var(--border); }
button.on { border-color: var(--scc); color: var(--scc); }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; overflow: hidden; cursor: grab; min-width: 0;
         background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 22px 22px; }
#stage.panning { cursor: grabbing; }
svg { width: 100%; height: 100%; display: block; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.in { stroke: var(--in); stroke-width: 2.4; }
.edge.out { stroke: var(--out); stroke-width: 2.4; }
.edge.back { stroke-dasharray: 5 4; }
.edge.hot { stroke-width: 2.4; }
.hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: grab; }
.node { cursor: pointer; }
.group rect { fill: color-mix(in srgb, var(--scc) 12%, transparent); stroke: var(--scc); stroke-opacity: .5; stroke-width: 1.2; stroke-dasharray: 4 3; }
.group text { fill: var(--scc); font: 600 11px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; }
.group text:hover { text-decoration: underline; }
.node rect.box { fill: var(--node); stroke: var(--c); stroke-width: 1.6; filter: drop-shadow(0 1px 2px var(--shadow)); }
.node rect.bar { fill: var(--c); }
.node text { fill: var(--text); font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
.node text.sub { fill: var(--muted); font: 11px -apple-system, BlinkMacSystemFont, sans-serif; }
.node line.divider { stroke: var(--c); stroke-opacity: .35; }
.node text.code { fill: var(--text); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.node text.code.synthetic { fill: var(--muted); font-style: italic; }
.node text.gutter { fill: var(--muted); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .7; }
.node g.toggle { cursor: pointer; }
.node g.toggle rect { fill: transparent; }
.node g.toggle:hover rect { fill: color-mix(in srgb, var(--c) 14%, transparent); }
.node g.toggle text { fill: var(--muted); font: 15px -apple-system, BlinkMacSystemFont, sans-serif; }
.node.self rect.box { stroke-width: 3; }
.node.in rect.box { stroke: var(--in); stroke-width: 2.4; }
.node.out rect.box { stroke: var(--out); stroke-width: 2.4; }
.node.line rect.box { stroke-width: 3; fill: color-mix(in srgb, var(--c) 14%, var(--node)); }
.dim .node:not(.self):not(.in):not(.out):not(.line) { opacity: .28; }
.dim .edge:not(.in):not(.out) { opacity: .2; }
.node.dragging { cursor: grabbing; }
aside { width: 420px; border-left: 1px solid var(--border); background: var(--panel); display: flex;
        flex-direction: column; min-height: 0; }
#detail { padding: 14px 16px; border-bottom: 1px solid var(--border); min-height: 112px; max-height: 40%; overflow: auto; }
#detail h2 { font-size: 13px; margin: 0 0 8px; font-family: ui-monospace, Menlo, monospace; }
#detail .meta { color: var(--muted); margin-bottom: 8px; }
.hint { color: var(--muted); }
#source { flex: 1; overflow: auto; padding: 8px 0; font: 12.5px/20px ui-monospace, SFMono-Regular, Menlo, monospace; }
.ln { display: flex; padding-right: 12px; cursor: default; }
.ln:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.ln.hl { background: var(--hl); box-shadow: inset 3px 0 0 var(--in); }
.ln .n { width: 44px; text-align: right; padding-right: 14px; color: var(--muted); opacity: .6; flex: none; user-select: none; }
.ln .t { white-space: pre; }
@media (max-width: 760px) {
    main { flex-direction: column; }
    #stage { min-height: 60vh; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--border); max-height: 50vh; }
}
</style>
</head>
<body>
<header>
<h1 id="title"></h1>
<div class="legend">
    <span style="--c: var(--module)">module</span><span style="--c: var(--branch)">branch</span>
    <span style="--c: var(--arm)">arm</span><span style="--c: var(--body)">body</span>
    <span style="--c: var(--def)">def / class</span><span style="--c: var(--exit)">exit</span>
    <span id="scc-legend" style="--c: var(--scc)">loop (SCC)</span>
    <span style="--c: var(--in)">into</span><span style="--c: var(--out)">out of</span>
</div>
<div class="tools">
    <button id="sccmode" type="button">SCC graph</button>
    <button id="all" type="button"></button>
    <button id="fit" type="button">Fit</button>
    <button id="relayout" type="button">Re-layout</button>
    <button id="theme" type="button"></button>
</div>
</header>
<main>
<div id="stage"><svg id="svg"><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"></path></marker>
    <marker id="arrow-in" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--in)"></path></marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--out)"></path></marker>
</defs><g id="world"><g id="groups"></g><g id="edges"></g><g id="nodes"></g></g></svg></div>
<aside>
    <div id="detail"></div>
    <div id="source"></div>
</aside>
</main>
<script type="application/json" id="data">__DATA__</script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const NS = "http://www.w3.org/2000/svg";
const NODE_H = 42, ROW_H = 16, CODE_PAD = 8, MAX_ROWS = 16, MAX_CHARS = 64, LAYER_GAP = 74, NODE_GAP = 28;
const ARROW = 9;   // arrowhead length in px, kept in sync with the markers' markerWidth
const svg = document.getElementById("svg"), world = document.getElementById("world");
const edgeLayer = document.getElementById("edges"), nodeLayer = document.getElementById("nodes");
const stage = document.getElementById("stage"), detail = document.getElementById("detail");
const sourceBox = document.getElementById("source"), allButton = document.getElementById("all");
const groupLayer = document.getElementById("groups");

// loop SCCs (condensed_graph.py): each starts collapsed into one node, which stands in for its nodes;
// clicking it expands them in place, inside a dashed box whose label collapses it again
const nodeById = new Map(data.nodes.map(n => [n.id, n]));
const sccOf = new Map();
const sccNodes = data.sccs.map((members, k) => {
    members.forEach(id => sccOf.set(id, k));
    const spans = members.map(id => nodeById.get(id).span).filter(Boolean);
    return { id: "scc" + k, scc: k, members, kind: "scc", code: [],
             label: `Loop SCC ${k + 1} · ${members.length} nodes`, type: `loop SCC: ${members.map(id => nodeById.get(id).label).join(", ")}`,
             span: spans.length ? [Math.min(...spans.map(s => s[0])), Math.max(...spans.map(s => s[1]))] : null };
});
if (!sccNodes.length) document.getElementById("scc-legend").remove();
const expanded = new Set();

// pure SCC mode: one node per SCC of the CondensedGraph, edges read only from its adj, never
// derived from the CFG, so the view shows exactly what the condenser built
const rawNodes = (data.scc_graph ? data.scc_graph.sccs : []).map(c => {
    const one = c.members.length === 1 ? nodeById.get(c.members[0]) : null;
    const spans = c.members.map(id => nodeById.get(id).span).filter(Boolean);
    return { id: "raw" + c.k, raw: c, code: [], kind: one ? one.kind : "scc",
             label: one ? `SCC ${c.k} · ${one.label}` : `SCC ${c.k} · ${c.members.length} nodes`,
             type: one ? "single node" : "loop",
             span: spans.length ? [Math.min(...spans.map(s => s[0])), Math.max(...spans.map(s => s[1]))] : null };
});
let sccMode = false;
const sccButton = document.getElementById("sccmode");
if (!data.scc_graph) { sccButton.disabled = true; sccButton.title = "no SCC graph: open this view with visualize_condensed"; }
sccButton.onclick = () => {
    sccMode = !sccMode;
    sccButton.classList.toggle("on", sccMode);
    pinned = hovered = null;
    offsets.clear(); bends.clear();
    buildView(); render(); fit();
};
const byId = new Map([...data.nodes, ...sccNodes, ...rawNodes].map(n => [n.id, n]));

// back edges (a loop's body going back to its head): found by a DFS from the roots, an edge into a
// node still on the DFS stack. The layout runs on the rest, which is a DAG; back edges are drawn apart.
let shownGraph, outs, ins, backEdges, fwdOuts, fwdIns;
const isBack = (u, v) => backEdges.has(u + ">" + v);
function buildView() {
    const shown = id => sccOf.has(id) && !expanded.has(sccOf.get(id)) ? "scc" + sccOf.get(id) : id;
    if (sccMode) {
        shownGraph = { nodes: rawNodes, edges: data.scc_graph.adj.map(([a, b]) => ["raw" + a, "raw" + b]) };
        return finishView();
    }
    const nodes = [...data.nodes.filter(n => shown(n.id) === n.id), ...sccNodes.filter(c => !expanded.has(c.scc))];
    const edges = [], seen = new Set();
    for (const [u, v] of data.edges) {
        const a = shown(u), b = shown(v);
        if (a === b || seen.has(a + ">" + b)) continue;   // inside a collapsed SCC, or already drawn
        seen.add(a + ">" + b); edges.push([a, b]);
    }
    shownGraph = { nodes, edges };
    finishView();
}
function finishView() {
    const { nodes, edges } = shownGraph;
    outs = new Map(nodes.map(n => [n.id, []])); ins = new Map(nodes.map(n => [n.id, []]));
    for (const [u, v] of edges) { outs.get(u).push(v); ins.get(v).push(u); }

    backEdges = new Set();
    const state = new Map();   // id -> 1 on the stack, 2 done
    const roots = nodes.filter(n => ins.get(n.id).length === 0).map(n => n.id);
    for (const root of [...roots, ...nodes.map(n => n.id)]) {
        if (state.has(root)) continue;
        const stack = [[root, 0]];
        state.set(root, 1);
        while (stack.length) {
            const top = stack[stack.length - 1], [u, i] = top;
            if (i < outs.get(u).length) {
                top[1]++;
                const v = outs.get(u)[i];
                if (state.get(v) === 1) backEdges.add(u + ">" + v);
                else if (!state.has(v)) { state.set(v, 1); stack.push([v, 0]); }
            } else { state.set(u, 2); stack.pop(); }
        }
    }
    fwdOuts = new Map(nodes.map(n => [n.id, outs.get(n.id).filter(v => !isBack(n.id, v))]));
    fwdIns = new Map(nodes.map(n => [n.id, ins.get(n.id).filter(u => !isBack(u, n.id))]));
}
buildView();
function toggleScc(k) {
    if (expanded.has(k)) expanded.delete(k); else expanded.add(k);
    pinned = hovered = null;
    buildView(); render();
}
document.getElementById("title").textContent =
    `${data.name} · ${data.nodes.length} nodes, ${data.edges.length} edges`;

// theme: auto (follows the OS) -> light -> dark, remembered when storage allows
const themes = ["auto", "light", "dark"], themeButton = document.getElementById("theme");
function applyTheme(theme) {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.dataset.theme = theme;
    themeButton.textContent = { auto: "◐ auto", light: "☀ light", dark: "☾ dark" }[theme];
    themeButton.dataset.theme = theme;
}
let savedTheme = "auto";
try { savedTheme = localStorage.getItem("rune-theme") || "auto"; } catch (e) {}
applyTheme(themes.includes(savedTheme) ? savedTheme : "auto");
themeButton.onclick = () => {
    const next = themes[(themes.indexOf(themeButton.dataset.theme) + 1) % themes.length];
    applyTheme(next);
    try { localStorage.setItem("rune-theme", next); } catch (e) {}
};

// ---------- sizes: the header, plus the code block when the node is open ----------
const measure = document.createElement("canvas").getContext("2d");
const textWidth = (text, font) => { measure.font = font; return Math.ceil(measure.measureText(text).width); };
for (const n of [...data.nodes, ...sccNodes, ...rawNodes]) {
    n.rows = n.code.slice(0, MAX_ROWS).map(([line, text, real]) =>
        ({ line, real, text: text.length > MAX_CHARS ? text.slice(0, MAX_CHARS - 1) + "…" : text }));
    if (n.code.length > MAX_ROWS) n.rows.push({ line: null, real: false, text: `… ${n.code.length - MAX_ROWS} more lines` });
    n.headW = Math.max(96, textWidth(n.label, "600 12px ui-monospace, SFMono-Regular, Menlo, monospace") + 34 + (n.rows.length ? 22 : 0));
    n.codeW = n.rows.length ? Math.max(...n.rows.map(r => textWidth(r.text || " ", "11px ui-monospace, SFMono-Regular, Menlo, monospace"))) + 52 : 0;
    n.open = false;
}
const size = n => ({ w: Math.max(n.headW, n.open ? n.codeW : 0), h: NODE_H + (n.open ? n.rows.length * ROW_H + CODE_PAD * 2 : 0) });

// ---------- layered layout ----------
function layout() {
    // layers: longest path from the roots, over the forward edges (a DAG once back edges are set aside)
    const indeg = new Map(shownGraph.nodes.map(n => [n.id, fwdIns.get(n.id).length]));
    const layer = new Map(), order = [];
    const queue = shownGraph.nodes.filter(n => indeg.get(n.id) === 0).map(n => n.id);
    for (const id of queue) layer.set(id, 0);
    while (queue.length) {
        const u = queue.shift(); order.push(u);
        for (const v of fwdOuts.get(u)) {
            layer.set(v, Math.max(layer.get(v) ?? 0, layer.get(u) + 1));
            indeg.set(v, indeg.get(v) - 1);
            if (indeg.get(v) === 0) queue.push(v);
        }
    }
    for (const n of shownGraph.nodes) if (!layer.has(n.id)) layer.set(n.id, 0);   // safety: cycles

    // long edges get a dummy point per skipped layer, so they route between nodes
    const items = new Map(shownGraph.nodes.map(n => [n.id, { id: n.id, layer: layer.get(n.id), ...size(n), real: true }]));
    const routes = [];   // per edge: the chain of item ids from u to v
    let dummy = 0;
    for (const [u, v] of shownGraph.edges) {
        if (isBack(u, v)) { routes.push({ u, v, chain: [u, v], back: true }); continue; }
        const chain = [u];
        for (let l = layer.get(u) + 1; l < layer.get(v); l++) {
            const id = "d" + (dummy++);
            items.set(id, { id, layer: l, w: 16, h: 0, real: false });
            chain.push(id);
        }
        chain.push(v);
        routes.push({ u, v, chain });
    }
    // nested loops: a back edge that spans another one is drawn outside it
    const backs = routes.filter(r => r.back);
    for (const r of backs) {
        const span = [layer.get(r.v), layer.get(r.u)];
        r.nest = backs.filter(o => o !== r && layer.get(o.v) >= span[0] && layer.get(o.u) <= span[1]).length;
    }
    const up = new Map([...items.keys()].map(k => [k, []])), down = new Map([...items.keys()].map(k => [k, []]));
    for (const r of routes) if (!r.back) for (let i = 0; i + 1 < r.chain.length; i++) {
        down.get(r.chain[i]).push(r.chain[i + 1]); up.get(r.chain[i + 1]).push(r.chain[i]);
    }

    // initial order: discovery order, then barycenter sweeps to reduce crossings
    const depth = Math.max(0, ...[...items.values()].map(it => it.layer)) + 1;
    const layers = Array.from({ length: depth }, () => []);
    const seen = new Set();
    const visit = id => { if (seen.has(id)) return; seen.add(id); layers[items.get(id).layer].push(id); down.get(id).forEach(visit); };
    order.forEach(visit); [...items.keys()].forEach(visit);
    const pos = new Map();
    layers.forEach(row => row.forEach((id, i) => pos.set(id, i)));
    const bary = (id, nbrs) => { const ns = nbrs.get(id); return ns.length ? ns.reduce((s, n) => s + pos.get(n), 0) / ns.length : pos.get(id); };
    for (let sweep = 0; sweep < 12; sweep++) {
        const goingDown = sweep % 2 === 0;
        const range = goingDown ? [...Array(depth).keys()].slice(1) : [...Array(depth).keys()].reverse().slice(1);
        for (const l of range) {
            const nbrs = goingDown ? up : down;
            layers[l].sort((a, b) => bary(a, nbrs) - bary(b, nbrs));
            layers[l].forEach((id, i) => pos.set(id, i));
        }
    }

    // x: pack each layer, then pull nodes toward their neighbours' average, keeping the gaps
    const x = new Map();
    for (const row of layers) {
        let cursor = 0;
        for (const id of row) { const w = items.get(id).w; x.set(id, cursor + w / 2); cursor += w + NODE_GAP; }
    }
    for (let it = 0; it < 24; it++) {
        const nbrs = it % 2 === 0 ? up : down;
        for (const row of layers) {
            const want = row.map(id => {
                const ns = [...nbrs.get(id), ...(it % 4 < 2 ? [] : (nbrs === up ? down : up).get(id))];
                return ns.length ? ns.reduce((s, n) => s + x.get(n), 0) / ns.length : x.get(id);
            });
            row.forEach((id, i) => x.set(id, (x.get(id) + want[i]) / 2));
            for (let i = 1; i < row.length; i++) {   // resolve overlaps left to right, then right to left
                const a = row[i - 1], b = row[i];
                const min = x.get(a) + items.get(a).w / 2 + NODE_GAP + items.get(b).w / 2;
                if (x.get(b) < min) x.set(b, min);
            }
            for (let i = row.length - 2; i >= 0; i--) {
                const a = row[i], b = row[i + 1];
                const max = x.get(b) - items.get(b).w / 2 - NODE_GAP - items.get(a).w / 2;
                if (x.get(a) > max) x.set(a, max);
            }
        }
    }

    // y: each layer is as tall as its tallest node (an open code block makes it taller)
    let top = 0;
    for (const row of layers) {
        const tallest = Math.max(NODE_H, ...row.map(id => items.get(id).h));
        for (const id of row) {
            const it = items.get(id);
            it.x = x.get(id);
            it.top = it.real ? top : top + NODE_H / 2;
        }
        top += tallest + LAYER_GAP;
    }
    return { items, routes };
}

// ---------- rendering ----------
let model, view = { x: 40, y: 30, k: 1 };
const offsets = new Map();   // node id -> {dx, dy} from dragging, kept when code is toggled
const bends = new Map();     // edge "u>v" -> {dx, dy}: where its middle was dragged to, relative to the default middle
const nodeEls = new Map(), edgeEls = [];
const box = id => {
    const it = model.items.get(id), o = offsets.get(id) || { dx: 0, dy: 0 };
    return { x: it.x + o.dx, top: it.top + o.dy, w: it.w, h: it.h };
};
const el = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    return e;
};

const edgeKey = r => r.u + ">" + r.v;

// a cubic from p0 to p1 through m: leaves p0 along d0, arrives at p1 along d1,
// and passes m heading from p0 towards p1, so the dragged point sits on one smooth line
function through(p0, d0, m, p1, d1) {
    const dist = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
    const t = [(p1[0] - p0[0]) / 4, (p1[1] - p0[1]) / 4], l0 = dist(p0, m) / 2, l1 = dist(m, p1) / 2;
    return `M${p0[0]},${p0[1]} C${p0[0] + d0[0] * l0},${p0[1] + d0[1] * l0} ${m[0] - t[0]},${m[1] - t[1]} ${m[0]},${m[1]}` +
           ` C${m[0] + t[0]},${m[1] + t[1]} ${p1[0] - d1[0] * l1},${p1[1] - d1[1] * l1} ${p1[0]},${p1[1]}`;
}

function edgePath(r) {
    const a = box(r.u), b = box(r.v), bend = bends.get(edgeKey(r));
    if (r.back) {
        // out of u's right side, up around the right, into the head's right side
        const ax = a.x + a.w / 2, ay = a.top + Math.min(a.h, NODE_H) / 2;
        const bx = b.x + b.w / 2 + 2 + ARROW, by = b.top + NODE_H / 2;   // the line stops at the arrowhead's back
        // clear every node in the layers the loop spans, so the arc never crosses one
        const lo = model.items.get(r.v).layer, hi = model.items.get(r.u).layer;
        let right = Math.max(ax, bx);
        for (const it of model.items.values())
            if (it.real && it.layer >= lo && it.layer <= hi) { const p = box(it.id); right = Math.max(right, p.x + p.w / 2); }
        const out = right + 36 + 14 * (r.nest || 0);
        if (bend) return through([ax, ay], [1, 0], [(ax + 6 * out + bx) / 8 + bend.dx, (ay + by) / 2 + bend.dy], [bx, by], [-1, 0]);
        return `M${ax},${ay} C${out},${ay} ${out},${by} ${bx},${by}`;
    }
    // one curve straight from u to v, like any other edge: the dummies only steer the layout,
    // so a long edge stays a single link and follows its ends when they're dragged
    const [x0, y0] = [a.x, a.top + a.h], [x1, y1] = [b.x, b.top - 2 - ARROW];   // the line stops at the arrowhead's back, its tip touches the node
    const my = (y0 + y1) / 2;
    if (bend) return through([x0, y0], [0, 1], [(x0 + x1) / 2 + bend.dx, my + bend.dy], [x1, y1], [0, 1]);
    // handles always point down out of u and down into v, so the arrow keeps entering v's top
    // even when v is dragged above u (handles at my would flip it)
    const k = Math.max(Math.abs(y1 - y0) / 2, 40);
    return `M${x0},${y0} C${x0},${y0 + k} ${x1},${y1 - k} ${x1},${y1}`;
}

function drawNode(n) {
    const { w, h } = size(n);
    const g = el("g", { class: "node" });
    g.style.setProperty("--c", `var(--${n.kind})`);
    g.append(el("rect", { class: "box", rx: 9, x: 0, y: 0, width: w, height: h }),
             el("rect", { class: "bar", rx: 2, x: 6, y: 8, width: 3.5, height: NODE_H - 16 }),
             el("text", { x: 16, y: n.span ? 19 : 25 }, n.label));
    if (n.span)
        g.appendChild(el("text", { class: "sub", x: 16, y: 34 },
            n.span[0] === n.span[1] ? `line ${n.span[0]}` : `lines ${n.span[0]}–${n.span[1]}`));
    if (n.rows.length) {
        const toggle = el("g", { class: "toggle" });
        toggle.append(el("rect", { x: w - 26, y: 10, width: 20, height: 20, rx: 5 }),
                      el("text", { x: w - 16, y: 25, "text-anchor": "middle" }, n.open ? "▾" : "▸"));
        toggle.addEventListener("pointerdown", e => e.stopPropagation());
        toggle.addEventListener("click", e => { e.stopPropagation(); n.open = !n.open; render(); });
        g.appendChild(toggle);
    }
    if (n.open) {
        g.appendChild(el("line", { class: "divider", x1: 1, x2: w - 1, y1: NODE_H, y2: NODE_H }));
        n.rows.forEach((r, i) => {
            const y = NODE_H + CODE_PAD + i * ROW_H + 12;
            g.appendChild(el("text", { class: "gutter", x: 30, y, "text-anchor": "end" }, r.line ?? ""));
            g.appendChild(el("text", { class: r.real ? "code" : "code synthetic", x: 38, y }, r.text || " "));
        });
    }
    return g;
}

function render() {
    model = layout();
    edgeLayer.textContent = ""; nodeLayer.textContent = ""; nodeEls.clear(); edgeEls.length = 0;
    for (const r of model.routes) {
        const path = el("path", { class: r.back ? "edge back" : "edge", "marker-end": "url(#arrow)" });
        const hit = el("path", { class: "hit" });   // a wide invisible twin, so the thin line is easy to grab
        edgeLayer.append(path, hit); edgeEls.push({ r, path, hit });
        attachEdge(r, path, hit);
    }
    for (const n of shownGraph.nodes) {
        const g = drawNode(n);
        nodeLayer.appendChild(g); nodeEls.set(n.id, g);
        place(n.id);
        attachNode(n, g);
    }
    edgeEls.forEach(drawEdge);
    drawGroups();
    allButton.textContent = shownGraph.nodes.some(n => n.open) ? "Hide all code" : "Show all code";
    paintFocus();
}

// an expanded SCC's nodes get a tinted halo each (a bounding box would also take in the
// unrelated nodes the layout puts between them), and its entry carries the collapse label
function drawGroups() {
    groupLayer.textContent = "";
    for (const k of sccMode ? [] : expanded) {
        const g = el("g", { class: "group" }), pad = 6;
        for (const id of data.sccs[k]) {
            const b = box(id);
            g.appendChild(el("rect", { x: b.x - b.w / 2 - pad, y: b.top - pad, width: b.w + pad * 2, height: b.h + pad * 2, rx: 13 }));
        }
        const entry = box(data.sccs[k][0]);   // nodes come in forward order: the first is the entry
        const label = el("text", { x: entry.x - entry.w / 2 - pad + 4, y: entry.top - pad - 5 }, `Loop SCC ${k + 1} ▾ collapse`);
        label.addEventListener("pointerdown", e => e.stopPropagation());
        label.addEventListener("click", e => { e.stopPropagation(); toggleScc(k); });
        g.appendChild(label);
        groupLayer.appendChild(g);
    }
}
function place(id) { const b = box(id); nodeEls.get(id).setAttribute("transform", `translate(${b.x - b.w / 2},${b.top})`); }
function drawEdge({ r, path, hit }) { const d = edgePath(r); path.setAttribute("d", d); hit.setAttribute("d", d); }
function redrawEdges(id) { for (const e of edgeEls) if (e.r.u === id || e.r.v === id) drawEdge(e); }
function applyView() { world.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`); }

function fit() {
    const bs = shownGraph.nodes.map(n => box(n.id));
    const minX = Math.min(...bs.map(b => b.x - b.w / 2)), maxX = Math.max(...bs.map(b => b.x + b.w / 2));
    const minY = Math.min(...bs.map(b => b.top)), maxY = Math.max(...bs.map(b => b.top + b.h));
    const W = stage.clientWidth, H = stage.clientHeight, pad = 40;
    // fit the width; a tall graph keeps a readable zoom and starts at the top (scroll or drag to pan)
    view.k = Math.min(1.4, (W - pad * 2) / Math.max(1, maxX - minX),
                      Math.max(0.75, (H - pad * 2) / Math.max(1, maxY - minY)));
    view.x = (W - (maxX - minX) * view.k) / 2 - minX * view.k;
    view.y = pad - minY * view.k;
    applyView();
}

// ---------- interaction ----------
let pinned = null, hovered = null, lineFocus = null;

function attachNode(n, g) {
    let start = null, moved = false;
    g.addEventListener("pointerdown", e => {
        e.stopPropagation(); g.setPointerCapture(e.pointerId);
        const o = offsets.get(n.id) || { dx: 0, dy: 0 };
        start = { px: e.clientX, py: e.clientY, dx: o.dx, dy: o.dy }; moved = false;
        g.classList.add("dragging");
    });
    g.addEventListener("pointermove", e => {
        if (!start) return;
        const dx = (e.clientX - start.px) / view.k, dy = (e.clientY - start.py) / view.k;
        if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
        offsets.set(n.id, { dx: start.dx + dx, dy: start.dy + dy });
        place(n.id); redrawEdges(n.id); if (sccOf.has(n.id)) drawGroups();
    });
    g.addEventListener("pointerup", () => {
        g.classList.remove("dragging");
        if (start && !moved && n.kind === "scc" && !n.raw) { start = null; toggleScc(n.scc); return; }
        if (start && !moved) { pinned = pinned === n.id ? null : n.id; paintFocus(); scrollToSpan(byId.get(pinned)); }
        start = null;
    });
    g.addEventListener("pointerenter", () => { hovered = n.id; paintFocus(); });
    g.addEventListener("pointerleave", () => { hovered = null; paintFocus(); });
}

// drag an edge by its middle; double-click puts it back. The bend is kept relative to the
// edge's ends, so dragging a node carries its edges along
function attachEdge(r, path, hit) {
    let start = null;
    hit.addEventListener("pointerdown", e => {
        e.stopPropagation(); hit.setPointerCapture(e.pointerId);
        const o = bends.get(edgeKey(r)) || { dx: 0, dy: 0 };
        start = { px: e.clientX, py: e.clientY, dx: o.dx, dy: o.dy };
    });
    hit.addEventListener("pointermove", e => {
        if (!start) return;
        bends.set(edgeKey(r), { dx: start.dx + (e.clientX - start.px) / view.k, dy: start.dy + (e.clientY - start.py) / view.k });
        drawEdge({ r, path, hit });
    });
    hit.addEventListener("pointerup", () => { start = null; });
    hit.addEventListener("dblclick", e => { e.stopPropagation(); bends.delete(edgeKey(r)); drawEdge({ r, path, hit }); });
    hit.addEventListener("pointerenter", () => path.classList.add("hot"));
    hit.addEventListener("pointerleave", () => path.classList.remove("hot"));
}

let pan = null;
stage.addEventListener("pointerdown", e => {
    pan = { px: e.clientX, py: e.clientY, x: view.x, y: view.y, moved: false };
    stage.setPointerCapture(e.pointerId); stage.classList.add("panning");
});
stage.addEventListener("pointermove", e => {
    if (!pan) return;
    const dx = e.clientX - pan.px, dy = e.clientY - pan.py;
    if (Math.abs(dx) + Math.abs(dy) > 2) pan.moved = true;
    view.x = pan.x + dx; view.y = pan.y + dy; applyView();
});
stage.addEventListener("pointerup", () => {
    if (pan && !pan.moved) { pinned = null; paintFocus(); }
    pan = null; stage.classList.remove("panning");
});
stage.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = stage.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const k = Math.min(3, Math.max(0.15, view.k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015))));
    view.x = mx - (mx - view.x) * (k / view.k); view.y = my - (my - view.y) * (k / view.k); view.k = k;
    applyView();
}, { passive: false });
document.addEventListener("keydown", e => { if (e.key === "Escape") { pinned = null; lineFocus = null; paintFocus(); } });
document.getElementById("fit").onclick = fit;
document.getElementById("relayout").onclick = () => { offsets.clear(); bends.clear(); render(); fit(); };
allButton.onclick = () => {
    const open = !shownGraph.nodes.some(n => n.open);
    shownGraph.nodes.forEach(n => { n.open = open && n.rows.length > 0; });
    render();
};

function paintFocus() {
    const focus = hovered ?? pinned;
    const lineNodes = lineFocus === null ? new Set() : new Set(shownGraph.nodes
        .filter(n => n.span && n.span[0] <= lineFocus && lineFocus <= n.span[1]).map(n => n.id));
    svg.classList.toggle("dim", focus !== null || lineNodes.size > 0);
    for (const [id, g] of nodeEls) {
        g.classList.toggle("self", id === focus);
        g.classList.toggle("in", focus !== null && outs.get(id).includes(focus));
        g.classList.toggle("out", focus !== null && ins.get(id).includes(focus));
        g.classList.toggle("line", lineNodes.has(id));
    }
    for (const { r, path } of edgeEls) {
        const isIn = focus !== null && r.v === focus, isOut = focus !== null && r.u === focus;
        path.classList.toggle("in", isIn); path.classList.toggle("out", isOut);
        path.setAttribute("marker-end", isIn ? "url(#arrow-in)" : isOut ? "url(#arrow-out)" : "url(#arrow)");
    }
    showDetail(focus === null ? null : byId.get(focus));
    highlightLines(focus === null ? null : byId.get(focus));
}

function showDetail(n) {
    if (!n) {
        detail.innerHTML = `<h2>Control flow graph</h2><div class="hint">Hover a node to see where it flows
            (orange: into it, cyan: out of it). Click to pin, drag to move, ▸ shows its code. Drag an edge to bend it, double-click it to straighten. Click a loop SCC to expand it. SCC graph shows the condensed graph as built.
            Scroll to zoom, drag the background to pan. Hover a source line to find its nodes. Esc clears.</div>`;
        return;
    }
    const lines = n.span ? (n.span[0] === n.span[1] ? `line ${n.span[0]}` : `lines ${n.span[0]}–${n.span[1]}`) : "no source position";
    const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const name = id => esc(byId.get(id).label);
    detail.innerHTML = `<h2>${esc(n.label)}</h2>
        <div class="meta">${esc(n.type)} · ${n.kind} · ${lines}<br>
        from: ${ins.get(n.id).map(name).join(", ") || "—"}<br>
        to: ${outs.get(n.id).map(name).join(", ") || "—"}</div>`;
    if (n.raw) {
        const cfgName = id => esc(nodeById.get(id).label);
        detail.innerHTML += `<div class="meta">entry: ${cfgName(n.raw.entry)}<br>
            visit order: ${n.raw.members.map(cfgName).join(" → ")}<br>
            out edges: ${n.raw.out_edges.map(([u, v]) => `${cfgName(u)} → ${cfgName(v)}`).join(", ") || "—"}</div>`;
    }
}

// ---------- source panel ----------
const lineEls = [];
if (data.source) {
    data.source.forEach((text, i) => {
        const row = document.createElement("div");
        row.className = "ln";
        const num = document.createElement("span"); num.className = "n"; num.textContent = i + 1;
        const t = document.createElement("span"); t.className = "t"; t.textContent = text || " ";
        row.append(num, t);
        row.addEventListener("pointerenter", () => { lineFocus = i + 1; paintFocus(); });
        row.addEventListener("pointerleave", () => { lineFocus = null; paintFocus(); });
        sourceBox.appendChild(row); lineEls.push(row);
    });
} else {
    sourceBox.innerHTML = `<div class="hint" style="padding: 8px 16px">No source given: pass source= to visualize_graph.</div>`;
}
function highlightLines(n) {
    lineEls.forEach((row, i) => row.classList.toggle("hl", !!(n && n.span && n.span[0] <= i + 1 && i + 1 <= n.span[1])));
}
function scrollToSpan(n) {
    if (n && n.span && lineEls[n.span[0] - 1]) lineEls[n.span[0] - 1].scrollIntoView({ block: "center", behavior: "smooth" });
}

render();
requestAnimationFrame(fit);
</script>
</body>
</html>
